<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

  :root{
    --rose-deep:#b5244f;
    --rose-mid:#d4466e;
    --rose-light:#f2a0b7;
    --rose-pale:#fce4ec;
    --cream:#fff7f8;
    --gold:#e8a85c;
    --wine:#6b1833;
  }

  html,body{
    width:100%;height:100%;overflow:hidden;
    font-family:'Cormorant Garamond',serif;
    background:var(--cream);
    color:var(--wine);
  }

  /* ── floating hearts background ── */
  .bg-hearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .bg-heart{
    position:absolute;bottom:-60px;
    font-size:24px;opacity:.18;
    animation:floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{transform:translateY(0) rotate(0deg) scale(1);opacity:.18}
    50%{opacity:.28}
    100%{transform:translateY(-110vh) rotate(360deg) scale(.6);opacity:0}
  }

  /* ── screens ── */
  .screen{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    transition:opacity .8s ease,transform .8s ease;
    z-index:1;
  }
  .screen.hidden{opacity:0;pointer-events:none;transform:scale(1.04)}

  /* ── ask screen ── */
  #ask-screen{
    background:
      radial-gradient(ellipse at 30% 20%,rgba(212,70,110,.12) 0%,transparent 50%),
      radial-gradient(ellipse at 70% 80%,rgba(242,160,183,.15) 0%,transparent 50%),
      var(--cream);
  }

  .question-mark{
    font-family:'Great Vibes',cursive;
    font-size:clamp(2.4rem,7vw,4.8rem);
    color:var(--rose-deep);
    text-align:center;
    line-height:1.25;
    margin-bottom:12px;
    animation:softPulse 3s ease-in-out infinite;
    text-shadow:0 2px 20px rgba(181,36,79,.15);
  }
  @keyframes softPulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.03)}
  }

  .sub-text{
    font-size:clamp(.95rem,2.5vw,1.25rem);
    font-style:italic;
    color:var(--rose-mid);
    margin-bottom:48px;
    opacity:.8;
    letter-spacing:.02em;
  }

  .btn-row{display:flex;gap:28px;align-items:center;position:relative;z-index:10}

  .btn{
    font-family:'Cormorant Garamond',serif;
    font-size:1.3rem;font-weight:700;
    border:none;cursor:pointer;
    padding:18px 56px;border-radius:60px;
    transition:transform .25s ease,box-shadow .25s ease,background .25s ease;
    letter-spacing:.05em;
  }

  .btn-yes{
    background:linear-gradient(135deg,var(--rose-deep),var(--rose-mid));
    color:#fff;
    box-shadow:0 6px 28px rgba(181,36,79,.4),0 0 0 0 rgba(181,36,79,0);
  }
  .btn-yes:hover{
    transform:scale(1.07);
    box-shadow:0 8px 36px rgba(181,36,79,.5),0 0 0 6px rgba(212,70,110,.15);
  }

  .btn-no{
    background:var(--rose-pale);
    color:var(--rose-deep);
    border:2px solid var(--rose-mid);
    box-shadow:0 4px 16px rgba(181,36,79,.2);
    position:relative;
    transition:transform .18s ease,opacity .18s ease;
    white-space:nowrap;
  }
  .btn-no.runaway{
    position:fixed;
    z-index:999;
  }
  .btn-no:hover{
    transform:scale(1.05);
  }

  /* ── escape message ── */
  .escape-msg{
    position:fixed;
    font-family:'Great Vibes',cursive;
    font-size:clamp(1.1rem,3vw,1.6rem);
    color:var(--rose-deep);
    pointer-events:none;
    z-index:998;
    animation:msgPop 5s ease forwards;
    text-shadow:0 1px 8px rgba(181,36,79,.2);
  }
  @keyframes msgPop{
    0%{opacity:0;transform:translateY(0) scale(.8)}
    10%{opacity:1;transform:translateY(-12px) scale(1)}
    80%{opacity:1;transform:translateY(-14px) scale(1)}
    100%{opacity:0;transform:translateY(-30px) scale(.9)}
  }

  /* ── celebration screen (scrollable) ── */
  #celebrate-screen{
    overflow-y:auto;
    overflow-x:hidden;
    justify-content:flex-start;
    padding:60px 20px 80px;
    background:
      radial-gradient(ellipse at 50% 20%,rgba(181,36,79,.06) 0%,transparent 60%),
      var(--cream);
  }

  .cel-section{
    width:100%;max-width:600px;
    display:flex;flex-direction:column;align-items:center;
    margin-bottom:50px;
  }

  .big-heart{
    font-size:clamp(5rem,15vw,9rem);
    animation:heartBeat 1.2s ease-in-out infinite;
    filter:drop-shadow(0 8px 30px rgba(181,36,79,.3));
    margin-bottom:20px;
  }
  @keyframes heartBeat{
    0%,100%{transform:scale(1)}
    15%{transform:scale(1.18)}
    30%{transform:scale(1)}
    45%{transform:scale(1.12)}
    60%{transform:scale(1)}
  }

  .celebrate-title{
    font-family:'Great Vibes',cursive;
    font-size:clamp(2rem,6vw,4rem);
    color:var(--rose-deep);
    text-align:center;
    margin-bottom:16px;
    animation:fadeSlideUp .8s ease .3s both;
    text-shadow:0 2px 16px rgba(181,36,79,.15);
  }
  .celebrate-msg{
    font-size:clamp(1rem,2.8vw,1.35rem);
    color:var(--wine);
    text-align:center;
    max-width:520px;
    line-height:1.7;
    font-style:italic;
    animation:fadeSlideUp .8s ease .6s both;
    padding:0 24px;
  }
  @keyframes fadeSlideUp{
    0%{opacity:0;transform:translateY(24px)}
    100%{opacity:1;transform:translateY(0)}
  }

  /* ── countdown timer ── */
  .countdown-section{
    animation:fadeSlideUp .8s ease 1s both;
  }
  .countdown-label{
    font-family:'Great Vibes',cursive;
    font-size:clamp(1.4rem,4vw,2.2rem);
    color:var(--rose-deep);
    text-align:center;
    margin-bottom:20px;
    text-shadow:0 1px 10px rgba(181,36,79,.12);
  }
  .countdown-boxes{
    display:flex;gap:16px;justify-content:center;flex-wrap:wrap;
  }
  .countdown-box{
    background:linear-gradient(145deg,#fff,var(--rose-pale));
    border:2px solid var(--rose-light);
    border-radius:16px;
    padding:16px 20px;
    min-width:80px;
    text-align:center;
    box-shadow:0 4px 20px rgba(181,36,79,.1);
  }
  .countdown-num{
    font-size:clamp(1.8rem,5vw,2.8rem);
    font-weight:700;
    color:var(--rose-deep);
    line-height:1;
  }
  .countdown-unit{
    font-size:.85rem;
    color:var(--rose-mid);
    margin-top:4px;
    letter-spacing:.05em;
    text-transform:uppercase;
  }

  /* ── photo gallery ── */
  .gallery-section{
    animation:fadeSlideUp .8s ease 1.3s both;
  }
  .gallery-title{
    font-family:'Great Vibes',cursive;
    font-size:clamp(1.3rem,3.5vw,2rem);
    color:var(--rose-deep);
    margin-bottom:20px;
    text-align:center;
  }
  .gallery-frame{
    position:relative;
    width:min(85vw,400px);
    height:min(60vw,300px);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 8px 40px rgba(181,36,79,.2),0 0 0 4px var(--rose-pale);
    background:var(--rose-pale);
  }
  .gallery-slide{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    opacity:0;
    transition:opacity 1s ease;
    flex-direction:column;
  }
  .gallery-slide.active{opacity:1}
  .gallery-slide img{
    width:100%;height:100%;
    object-fit:cover;
    border-radius:14px;
  }
  .gallery-slide-caption{
    position:absolute;bottom:0;left:0;right:0;
    padding:14px;
    background:linear-gradient(transparent,rgba(107,24,51,.7));
    font-family:'Great Vibes',cursive;
    font-size:clamp(1.1rem,3vw,1.6rem);
    color:#fff;
    text-align:center;
    border-radius:0 0 14px 14px;
    text-shadow:0 1px 6px rgba(0,0,0,.4);
  }
  .gallery-dots{
    display:flex;gap:10px;margin-top:16px;justify-content:center;
  }
  .gallery-dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--rose-light);
    transition:background .3s ease,transform .3s ease;
    cursor:pointer;
    border:none;
  }
  .gallery-dot.active{
    background:var(--rose-deep);
    transform:scale(1.3);
  }

  /* ── love letter ── */
  .letter-section{
    animation:fadeSlideUp .8s ease 1.6s both;
  }
  .letter-container{
    background:linear-gradient(170deg,#fffaf5,#fff5f5);
    border:2px solid var(--rose-light);
    border-radius:20px;
    padding:36px 32px;
    max-width:500px;
    width:90vw;
    box-shadow:0 8px 40px rgba(181,36,79,.1),inset 0 1px 0 rgba(255,255,255,.8);
    position:relative;
    overflow:hidden;
  }
  .letter-container::before{
    content:'';position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,var(--rose-deep),var(--gold),var(--rose-mid));
  }
  .letter-heading{
    font-family:'Great Vibes',cursive;
    font-size:clamp(1.4rem,4vw,2rem);
    color:var(--rose-deep);
    margin-bottom:16px;
    text-align:center;
  }
  .letter-body{
    font-size:clamp(.95rem,2.5vw,1.15rem);
    line-height:1.85;
    color:var(--wine);
    min-height:120px;
  }
  .letter-cursor{
    display:inline-block;
    width:2px;height:1.1em;
    background:var(--rose-deep);
    margin-left:2px;
    vertical-align:text-bottom;
    animation:blink .6s steps(1) infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

  /* ── footer ── */
  .celebrate-footer{
    margin-top:20px;
    font-family:'Great Vibes',cursive;
    font-size:clamp(1.2rem,3vw,1.8rem);
    color:var(--gold);
    animation:fadeSlideUp .8s ease 1.9s both;
    text-shadow:0 1px 6px rgba(232,168,92,.25);
  }

  /* ── music button ── */
  .music-btn{
    position:fixed;bottom:20px;right:20px;z-index:100;
    width:48px;height:48px;border-radius:50%;
    background:linear-gradient(135deg,var(--rose-deep),var(--rose-mid));
    color:#fff;border:none;cursor:pointer;
    font-size:1.3rem;
    box-shadow:0 4px 16px rgba(181,36,79,.35);
    transition:transform .2s ease;
    display:none;
    align-items:center;justify-content:center;
  }
  .music-btn:hover{transform:scale(1.1)}
  .music-btn.visible{display:flex}

  /* ── scroll indicator ── */
  .scroll-hint{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    z-index:50;animation:fadeSlideUp .8s ease 2.5s both;
    display:none;
  }
  .scroll-hint.visible{display:block}
  .scroll-arrow{
    font-size:1.4rem;color:var(--rose-mid);
    animation:bounce 1.5s ease infinite;
    text-align:center;
  }
  .scroll-hint-text{
    font-size:.8rem;color:var(--rose-mid);text-align:center;
    margin-top:2px;letter-spacing:.05em;
  }
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}

  /* ── confetti canvas ── */
  #confetti-canvas{
    position:fixed;inset:0;z-index:0;pointer-events:none;
  }

  /* ── petal burst ── */
  .petal{
    position:fixed;
    width:12px;height:12px;
    border-radius:50% 0 50% 50%;
    pointer-events:none;
    z-index:2;
    opacity:0;
    animation:petalFall linear forwards;
  }
  @keyframes petalFall{
    0%{opacity:.9;transform:translate(0,0) rotate(0deg) scale(1)}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(720deg) scale(.3)}
  }

  /* ── tablet ── */
  @media(max-width:768px){
    #celebrate-screen{padding:40px 16px 60px}
    .cel-section{margin-bottom:36px}
    .gallery-frame{width:90vw;height:65vw}
    .letter-container{padding:28px 22px;width:92vw}
    .countdown-box{min-width:70px;padding:14px 16px}
  }

  /* ── mobile ── */
  @media(max-width:500px){
    .question-mark{font-size:clamp(1.8rem,6vw,3rem);padding:0 16px}
    .sub-text{font-size:clamp(.85rem,2.2vw,1rem);margin-bottom:32px}
    .btn{padding:14px 42px;font-size:1.05rem}
    .btn-row{gap:14px}
    .big-heart{font-size:clamp(3.5rem,12vw,6rem)}
    .celebrate-title{font-size:clamp(1.6rem,5vw,2.5rem)}
    .celebrate-msg{font-size:clamp(.9rem,2.5vw,1.1rem);padding:0 12px}
    .countdown-boxes{gap:10px}
    .countdown-box{min-width:60px;padding:10px 12px}
    .countdown-num{font-size:clamp(1.4rem,4vw,2rem)}
    .countdown-unit{font-size:.7rem}
    .gallery-frame{width:92vw;height:70vw;border-radius:14px}
    .gallery-title{font-size:clamp(1.1rem,3vw,1.5rem)}
    .letter-container{padding:20px 16px;width:94vw;border-radius:14px}
    .letter-heading{font-size:clamp(1.2rem,3.5vw,1.6rem)}
    .letter-body{font-size:clamp(.85rem,2.3vw,1rem);line-height:1.7}
    .celebrate-footer{font-size:clamp(1rem,2.5vw,1.4rem)}
    .music-btn{width:40px;height:40px;font-size:1.1rem;bottom:14px;right:14px}
    .escape-msg{font-size:clamp(.9rem,2.5vw,1.2rem)}
  }

  /* ── very small phones ── */
  @media(max-width:360px){
    .question-mark{font-size:1.6rem}
    .btn{padding:12px 34px;font-size:.95rem}
    .countdown-box{min-width:55px;padding:8px 10px}
    .gallery-frame{height:75vw}
    .letter-container{padding:16px 12px}
  }
</style>
</head>
<body>

<!-- background music -->
<audio id="bg-music" loop preload="auto">
  <source src="mp3/mp3.mpeg" type="audio/mpeg">
</audio>

<!-- floating hearts background -->
<div class="bg-hearts" id="bg-hearts"></div>

<!-- MUSIC BUTTON -->
<button class="music-btn" id="music-btn" title="Toggle music"></button>

<!-- ASK SCREEN -->
<div class="screen" id="ask-screen">
  <div class="question-mark">Mama, Will You Be My Valentine?</div>
  <div class="sub-text">&mdash; your Rajesh needs to know&hellip;</div>
  <div class="btn-row">
    <button class="btn btn-yes" id="btn-yes">Yes</button>
    <button class="btn btn-no" id="btn-no">No</button>
  </div>
</div>

<!-- CELEBRATE SCREEN -->
<div class="screen hidden" id="celebrate-screen">
  <canvas id="confetti-canvas"></canvas>

  <!-- Section 1: Big heart + message -->
  <div class="cel-section">
    <div class="big-heart" id="big-heart"></div>
    <div class="celebrate-title">I Knew You'd Say Yes!</div>
    <div class="celebrate-msg" id="celebrate-msg"></div>
  </div>

  <!-- Section 2: Countdown -->
  <div class="cel-section countdown-section">
    <div class="countdown-label" id="countdown-label"></div>
    <div class="countdown-boxes" id="countdown-boxes"></div>
  </div>

  <!-- Section 3: Photo Gallery -->
  <div class="cel-section gallery-section">
    <div class="gallery-title">Our Moments Together</div>
    <div class="gallery-frame" id="gallery-frame"></div>
    <div class="gallery-dots" id="gallery-dots"></div>
  </div>

  <!-- Section 4: Typing Love Letter -->
  <div class="cel-section letter-section">
    <div class="letter-container">
      <div class="letter-heading">A Letter For You</div>
      <div class="letter-body" id="letter-body"><span class="letter-cursor" id="letter-cursor"></span></div>
    </div>
  </div>

  <div class="celebrate-footer" id="celebrate-footer"></div>
</div>

<!-- Scroll hint -->
<div class="scroll-hint" id="scroll-hint">
  <div class="scroll-arrow" id="scroll-arrow"></div>
  <div class="scroll-hint-text">scroll down</div>
</div>

<script>
(function(){

  /* ── safe text helper ── */
  function setText(id, text){
    document.getElementById(id).textContent = text;
  }

  /* ── set static content via textContent (no innerHTML) ── */
  setText('big-heart', '\u2764\uFE0F');
  setText('music-btn', '\u266B');
  setText('scroll-arrow', '\u2304');
  setText('celebrate-footer', 'Forever Yours, Rajesh \u2665');

  /* celebrate msg needs line breaks, build with DOM */
  (function(){
    var el = document.getElementById('celebrate-msg');
    el.appendChild(document.createTextNode('Mama, you mean the world to me \u2014 every moment with you is a gift I never want to stop unwrapping.'));
    el.appendChild(document.createElement('br'));
    el.appendChild(document.createElement('br'));
    el.appendChild(document.createTextNode('Happy Valentine\u2019s Day, my love \uD83D\uDC95'));
  })();

  /* ══════════════════════════════════
     BACKGROUND FLOATING HEARTS
  ══════════════════════════════════ */
  var bgContainer = document.getElementById('bg-hearts');
  var heartChars = ['\u2665','\u2661','\u2764','\uD83D\uDC95','\u2763'];
  function spawnBgHeart(){
    var el = document.createElement('span');
    el.className = 'bg-heart';
    el.textContent = heartChars[Math.random()*heartChars.length|0];
    el.style.left = Math.random()*100+'%';
    el.style.fontSize = (14+Math.random()*22)+'px';
    var dur = 6+Math.random()*8;
    el.style.animationDuration = dur+'s';
    el.style.animationDelay = Math.random()*2+'s';
    bgContainer.appendChild(el);
    setTimeout(function(){el.remove()},(dur+2)*1000);
  }
  setInterval(spawnBgHeart,700);
  for(var i=0;i<10;i++) setTimeout(spawnBgHeart,i*300);

  /* ══════════════════════════════════
     ESCAPE MESSAGES (No button)
  ══════════════════════════════════ */
  var msgs = [
    "Are you sure, Mama? \uD83E\uDD7A",
    "Think again, my love!",
    "Wrong button, Mama!",
    "You're breaking Rajesh's heart!",
    "Try the other one, Mama! \uD83D\uDC95",
    "Nope, not that one!",
    "Really, Mama?? \uD83D\uDE22",
    "Rajesh won't let you!",
    "Nice try, my love!",
    "That button doesn't work \uD83D\uDE0F",
    "Mama, you don't mean that!",
    "Please, Mama? \uD83E\uDD79",
    "My heart says otherwise!",
    "Click the pretty one, Mama!",
    "Rajesh misses you already! \uD83D\uDE2D",
    "Mama + Rajesh = Forever! \u2764",
  ];
  var msgIdx = 0;

  function showEscapeMsg(x, y){
    var el = document.createElement('div');
    el.className = 'escape-msg';
    el.textContent = msgs[msgIdx % msgs.length];
    msgIdx++;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(function(){el.remove()},5500);
  }

  /* ══════════════════════════════════
     NO BUTTON ESCAPE LOGIC
  ══════════════════════════════════ */
  var btnNo = document.getElementById('btn-no');
  var btnYes = document.getElementById('btn-yes');
  var escaped = false;

  function escapeNo(){
    var pad = 20;
    var bw = btnNo.offsetWidth;
    var bh = btnNo.offsetHeight;
    var vw = window.innerWidth;
    var vh = window.innerHeight;

    var nx, ny, attempts = 0;
    do {
      nx = pad + Math.random()*(vw - bw - pad*2);
      ny = pad + Math.random()*(vh - bh - pad*2);
      attempts++;
    } while(
      attempts < 30 &&
      Math.abs(nx - btnYes.getBoundingClientRect().left) < 160 &&
      Math.abs(ny - btnYes.getBoundingClientRect().top) < 80
    );

    if(!escaped){
      btnNo.classList.add('runaway');
      escaped = true;
    }

    var rect = btnNo.getBoundingClientRect();
    showEscapeMsg(rect.left + bw/2 - 60, rect.top - 36);

    btnNo.style.left = nx + 'px';
    btnNo.style.top = ny + 'px';
  }

  btnNo.addEventListener('mouseenter', escapeNo);
  btnNo.addEventListener('touchstart', function(e){
    e.preventDefault();
    escapeNo();
  }, {passive:false});
  btnNo.addEventListener('click', function(e){
    e.preventDefault();
    escapeNo();
  });

  /* ══════════════════════════════════
     YES → CELEBRATE
  ══════════════════════════════════ */
  btnYes.addEventListener('click', celebrate);

  function celebrate(){
    document.getElementById('ask-screen').classList.add('hidden');
    document.getElementById('celebrate-screen').classList.remove('hidden');
    launchConfetti();
    burstPetals();
    startMusic();
    buildCountdown();
    buildGallery();
    setTimeout(startLoveLetter, 2000);
    setTimeout(function(){
      document.getElementById('scroll-hint').classList.add('visible');
    },3000);
    document.getElementById('celebrate-screen').addEventListener('scroll',function(){
      document.getElementById('scroll-hint').classList.remove('visible');
    },{once:true});
  }

  /* ══════════════════════════════════
     BACKGROUND MUSIC
  ══════════════════════════════════ */
  var audio = document.getElementById('bg-music');
  var musicBtn = document.getElementById('music-btn');
  var musicPlaying = false;

  function startMusic(){
    audio.volume = 0.5;
    audio.play().then(function(){
      musicPlaying = true;
      musicBtn.classList.add('visible');
      musicBtn.textContent = '\u266B';
    }).catch(function(){
      musicBtn.classList.add('visible');
      musicBtn.textContent = '\u266B';
    });
  }

  musicBtn.addEventListener('click',function(){
    if(musicPlaying){
      audio.pause();
      musicPlaying = false;
      musicBtn.textContent = '\u266A';
      musicBtn.style.opacity = '.5';
    } else {
      audio.play();
      musicPlaying = true;
      musicBtn.textContent = '\u266B';
      musicBtn.style.opacity = '1';
    }
  });

  /* ══════════════════════════════════
     COUNTDOWN TIMER
  ══════════════════════════════════ */
  function makeBox(num, unit, parent){
    var box = document.createElement('div');
    box.className = 'countdown-box';
    var numEl = document.createElement('div');
    numEl.className = 'countdown-num';
    numEl.textContent = num;
    var unitEl = document.createElement('div');
    unitEl.className = 'countdown-unit';
    unitEl.textContent = unit;
    box.appendChild(numEl);
    box.appendChild(unitEl);
    parent.appendChild(box);
  }

  function calcTime(diff){
    var totalSec = Math.floor(Math.abs(diff)/1000);
    return {
      days: Math.floor(totalSec/86400),
      hrs: Math.floor((totalSec%86400)/3600),
      mins: Math.floor((totalSec%3600)/60),
      secs: totalSec%60
    };
  }

  function buildCountdown(){
    var target = new Date('2026-11-04T00:00:00');
    var now = new Date();
    var diff = target - now;
    var container = document.getElementById('countdown-boxes');
    var label = document.getElementById('countdown-label');

    label.textContent = diff > 0 ? 'Counting Down to Our Day' : 'Loving You For';

    var t = calcTime(diff);
    makeBox(t.days, 'Days', container);
    makeBox(t.hrs, 'Hours', container);
    makeBox(t.mins, 'Minutes', container);
    makeBox(t.secs, 'Seconds', container);

    setInterval(function(){
      var now2 = new Date();
      var diff2 = target - now2;
      var t2 = calcTime(diff2);
      var nums = container.querySelectorAll('.countdown-num');
      if(nums[0]) nums[0].textContent = t2.days;
      if(nums[1]) nums[1].textContent = t2.hrs;
      if(nums[2]) nums[2].textContent = t2.mins;
      if(nums[3]) nums[3].textContent = t2.secs;
    },1000);
  }

  /* ══════════════════════════════════
     PHOTO GALLERY (placeholders)
  ══════════════════════════════════ */
  var gallerySlides = [
    {img:'images/01.jpeg', text:'Mama + Rajesh'},
    {img:'images/02.jpeg', text:'Our Love Story'},
    {img:'images/03.jpeg', text:'My Precious Mama'},
    {img:'images/04.jpeg', text:'Forever Together'},
    {img:'images/05.jpeg', text:'You & Me'},
    {img:'images/06.jpeg', text:'My Everything'},
    {img:'images/07.jpeg', text:'Beautiful Moments'},
  ];
  var currentSlide = 0;
  var slideInterval;

  function buildGallery(){
    var frame = document.getElementById('gallery-frame');
    var dotsContainer = document.getElementById('gallery-dots');

    gallerySlides.forEach(function(s, i){
      var slide = document.createElement('div');
      slide.className = 'gallery-slide' + (i === 0 ? ' active' : '');

      var imgEl = document.createElement('img');
      imgEl.src = s.img;
      imgEl.alt = s.text;

      var captionEl = document.createElement('div');
      captionEl.className = 'gallery-slide-caption';
      captionEl.textContent = s.text;

      slide.appendChild(imgEl);
      slide.appendChild(captionEl);
      frame.appendChild(slide);

      var dot = document.createElement('button');
      dot.className = 'gallery-dot' + (i === 0 ? ' active' : '');
      dot.addEventListener('click', (function(idx){ return function(){ goToSlide(idx); }; })(i));
      dotsContainer.appendChild(dot);
    });

    slideInterval = setInterval(nextSlide, 4000);
  }

  function goToSlide(idx){
    var slides = document.querySelectorAll('.gallery-slide');
    var dots = document.querySelectorAll('.gallery-dot');
    slides[currentSlide].classList.remove('active');
    dots[currentSlide].classList.remove('active');
    currentSlide = idx;
    slides[currentSlide].classList.add('active');
    dots[currentSlide].classList.add('active');
    clearInterval(slideInterval);
    slideInterval = setInterval(nextSlide, 4000);
  }

  function nextSlide(){
    goToSlide((currentSlide + 1) % gallerySlides.length);
  }

  /* ══════════════════════════════════
     TYPING LOVE LETTER
  ══════════════════════════════════ */
  var loveLetterText =
    "My Dearest Mama,\n\n" +
    "You have a very special place in my heart. You're the only person I loved so truly and madly.\n\n" +
    "Without you my life would be empty and meaningless. Every day with you is special but today is extra special day.\n\n" +
    "I'm forever grateful for having someone like you in my life. You are the one who brings immense joy to my life. I love you from the bottom of my heart. You're my most precious one.\n\n" +
    "You always will be one of my most loved ones... Thanks for being with me.\n\n" +
    "HAPPY VALENTINE DAY MY LOVE \u2764\n\n" +
    "Forever yours,\nRajesh";

  function startLoveLetter(){
    var container = document.getElementById('letter-body');
    var cursor = document.getElementById('letter-cursor');
    var i = 0;

    function typeNext(){
      if(i >= loveLetterText.length){
        cursor.style.display = 'none';
        return;
      }
      var ch = loveLetterText[i];
      if(ch === '\n'){
        container.insertBefore(document.createElement('br'), cursor);
      } else {
        container.insertBefore(document.createTextNode(ch), cursor);
      }
      i++;
      var delay = 35;
      if(ch === '.' || ch === ',' || ch === '\n') delay = 150;
      if(ch === ' ') delay = 20;
      setTimeout(typeNext, delay);
    }
    typeNext();
  }

  /* ══════════════════════════════════
     CONFETTI (canvas)
  ══════════════════════════════════ */
  function launchConfetti(){
    var canvas = document.getElementById('confetti-canvas');
    var ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    var colors = ['#b5244f','#d4466e','#f2a0b7','#e8a85c','#fce4ec','#ff6b8a','#c2185b'];
    var shapes = [];

    for(var i=0;i<220;i++){
      shapes.push({
        x: canvas.width/2 + (Math.random()-.5)*200,
        y: canvas.height * .35,
        vx: (Math.random()-.5)*14,
        vy: -4 - Math.random()*12,
        r: 4+Math.random()*6,
        color: colors[Math.random()*colors.length|0],
        rot: Math.random()*Math.PI*2,
        rotSpeed: (Math.random()-.5)*.2,
        type: Math.random()<.4?'heart':'rect',
        life: 1,
      });
    }

    function drawHeart(cx,cy,size,rot,color,alpha){
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(rot);
      ctx.scale(size/12,size/12);
      ctx.beginPath();
      ctx.moveTo(0,-6);
      ctx.bezierCurveTo(-8,-14,-16,-4,0,8);
      ctx.moveTo(0,-6);
      ctx.bezierCurveTo(8,-14,16,-4,0,8);
      ctx.fillStyle = color;
      ctx.globalAlpha = alpha;
      ctx.fill();
      ctx.restore();
    }

    var frame = 0;
    function tick(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      var alive = false;
      for(var j=0;j<shapes.length;j++){
        var s = shapes[j];
        if(s.life<=0) continue;
        alive = true;
        s.vy += .18;
        s.vx *= .99;
        s.x += s.vx;
        s.y += s.vy;
        s.rot += s.rotSpeed;
        if(s.y > canvas.height + 20) s.life = 0;
        if(frame > 60) s.life -= .006;

        var alpha = Math.max(0,s.life);
        if(s.type==='heart'){
          drawHeart(s.x,s.y,s.r,s.rot,s.color,alpha);
        } else {
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(s.x,s.y);
          ctx.rotate(s.rot);
          ctx.fillStyle = s.color;
          ctx.fillRect(-s.r/2,-s.r/2,s.r,s.r*1.6);
          ctx.restore();
        }
      }
      ctx.globalAlpha = 1;
      frame++;
      if(alive) requestAnimationFrame(tick);
    }
    tick();

    setTimeout(function(){
      for(var i=0;i<120;i++){
        shapes.push({
          x: Math.random()*canvas.width,
          y: -20,
          vx: (Math.random()-.5)*4,
          vy: 1+Math.random()*4,
          r: 3+Math.random()*5,
          color: colors[Math.random()*colors.length|0],
          rot: Math.random()*Math.PI*2,
          rotSpeed: (Math.random()-.5)*.15,
          type: Math.random()<.5?'heart':'rect',
          life: 1,
        });
      }
      frame = 0;
      tick();
    },1400);
  }

  /* ══════════════════════════════════
     PETAL BURST
  ══════════════════════════════════ */
  function burstPetals(){
    var petalColors = ['#b5244f','#d4466e','#f2a0b7','#e8a85c','#ff8fa3'];
    for(var i=0;i<30;i++){
      var el = document.createElement('div');
      el.className = 'petal';
      el.style.background = petalColors[Math.random()*petalColors.length|0];
      el.style.left = (window.innerWidth/2 - 6) + 'px';
      el.style.top = (window.innerHeight * .32) + 'px';
      var angle = Math.random()*Math.PI*2;
      var dist = 100 + Math.random()*300;
      el.style.setProperty('--dx', Math.cos(angle)*dist+'px');
      el.style.setProperty('--dy', Math.sin(angle)*dist+'px');
      el.style.animationDuration = (1+Math.random()*1.5)+'s';
      el.style.animationDelay = Math.random()*.3+'s';
      el.style.width = (8+Math.random()*10)+'px';
      el.style.height = (8+Math.random()*10)+'px';
      document.body.appendChild(el);
      setTimeout(function(e){return function(){e.remove()}}(el),3000);
    }
  }

  /* ── resize ── */
  window.addEventListener('resize',function(){
    var c = document.getElementById('confetti-canvas');
    if(c){c.width=window.innerWidth;c.height=window.innerHeight}
  });

})();
</script>
